# 域名反向代理模板（示例域名 example.com；部署时替换为真实域名）。
# 位置：/etc/nginx/sites-available/website-workspace.conf -> sites-enabled/
# 证书：certbot --nginx -d example.com；本模板不改变既有代理与其它站点。
limit_req_zone $binary_remote_addr zone=workspace_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    # ACME HTTP-01 由 certbot 处理，其余重定向到 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 维护期：升级脚本写入 maintenance 标记，写请求返回可重试 503（不伪装成认证失败）
    if (-f /var/lib/website-workspace/maintenance.on) {
        set $maint 1;
    }

    location / {
        # 维护期只读放行 GET/HEAD，写请求由应用中间件返回 503 Retry-After
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location /static/ {
        alias /opt/website-workspace/current/prototype/dist/client/assets/;
        access_log off;
        expires 7d;
    }
}
